
<main class="page-contacts">
  <section class="grid-container align-justify grid-x grid-padding-x grid-padding-y contacts-wrap">
    <h1 class="cell small-12 page-title">CONTACT US</h1>
    <div class="cell small-12 medium-5">
      <h2>Get in touch</h2>
      <ul class="grid-y grid-padding-y grid-padding-x grid-margin-y contact-blocks">
        <li class="cell">
          <p class="contact-blocks__title">Call Us</p>
          <a href="tel:7817732868">781-773-2868</a>
        </li>
        <li class="cell">
          <p class="contact-blocks__title">E-mail</p>
          <a href="mailto:sales@thewhitelabelagency.com">sales@thewhitelabelagency.com</a>
        </li>
        <li class="cell">
          <p class="contact-blocks__title">Location</p>
          <p class="contact-blocks__address">Harrison Ave Suite 605, Boston, Massachusetts</p>
        </li>
      </ul>
    </div>
    <div class="cell small-12 medium-6">
      <h2>How can we help?</h2>
      <form class="contact-form">
        <div class="input-wrap">
          <input type="text" name="firstName" id="firstName" required />
          <label for="firstName">Your name</label>
        </div>
        <div class="input-wrap">
          <input type="email" name="email" id="email" required />
          <label for="email">Work email</label>
        </div>
        <div class="input-wrap">
          <input type="tel" name="phone" id="phone" required />
          <label for="phone">Phone number</label>
        </div>
        <div class="input-wrap">
          <textarea name="message" id="message" rows="5"></textarea>
          <label for="message">Your message</label>
        </div>
        <button class="button warning radius expanded" type="submit">Submit</button>
      </form>
    </div>
  </section>
</main>
